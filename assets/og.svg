<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="60%">
      <stop offset="0%" stop-color="#2a1a4a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="sword" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0ff"/>
      <stop offset="100%" stop-color="#a0a0d0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#6bcb77"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fireglow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Decorative line -->
  <line x1="150" y1="280" x2="450" y2="280" stroke="#8B5CF6" stroke-width="1" opacity="0.3"/>
  <line x1="750" y1="280" x2="1050" y2="280" stroke="#8B5CF6" stroke-width="1" opacity="0.3"/>
  <!-- Title -->
  <text x="600" y="320" text-anchor="middle" font-family="Georgia, serif" font-size="110" font-weight="bold" fill="url(#title)" filter="url(#glow)">FARBORN</text>
  <!-- Subtitle -->
  <text x="600" y="380" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#888" letter-spacing="12">BORN IN THE FAR</text>
  <!-- Sword -->
  <rect x="592" y="410" width="6" height="120" rx="2" fill="url(#sword)" opacity="0.6"/>
  <rect x="575" y="526" width="40" height="6" rx="3" fill="#ffd700" opacity="0.6"/>
  <!-- Fire particles -->
  <circle cx="300" cy="200" r="5" fill="#ff6b6b" opacity="0.5"/>
  <circle cx="320" cy="180" r="3" fill="#ffd93d" opacity="0.4"/>
  <circle cx="900" cy="210" r="4" fill="#ffd93d" opacity="0.4"/>
  <circle cx="880" cy="190" r="3" fill="#ff6b6b" opacity="0.3"/>
  <circle cx="200" cy="500" r="3" fill="#6bcb77" opacity="0.3"/>
  <circle cx="1000" cy="490" r="4" fill="#6bcb77" opacity="0.3"/>
  <circle cx="500" cy="650" r="3" fill="#8B5CF6" opacity="0.3"/>
  <circle cx="700" cy="640" r="3" fill="#8B5CF6" opacity="0.3"/>
  <!-- Bottom text -->
  <text x="600" y="720" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#555" letter-spacing="3">IDLE RPG · BASE CHAIN · COLLECT LOOT</text>
</svg>
