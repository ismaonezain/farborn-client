<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1a4a"/>
      <stop offset="100%" stop-color="#0a0a2a"/>
    </radialGradient>
    <linearGradient id="sword" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e0ff"/>
      <stop offset="100%" stop-color="#8888cc"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- BG circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#8B5CF6" stroke-width="3" opacity="0.4"/>
  <!-- Shield -->
  <path d="M256 140 L320 175 L320 260 Q320 320 256 360 Q192 320 192 260 L192 175 Z"
        fill="#1a1a3a" stroke="#8B5CF6" stroke-width="4" opacity="0.9"/>
  <path d="M256 160 L305 188 L305 258 Q305 308 256 342 Q207 308 207 258 L207 188 Z"
        fill="none" stroke="#6bcb77" stroke-width="2" opacity="0.5"/>
  <!-- Sword blade -->
  <rect x="248" y="100" width="16" height="200" rx="3" fill="url(#blade)" filter="url(#glow)"/>
  <!-- Sword guard -->
  <rect x="220" y="290" width="72" height="12" rx="4" fill="url(#sword)"/>
  <!-- Sword handle -->
  <rect x="248" y="302" width="16" height="40" rx="3" fill="#8B5CF6"/>
  <!-- Sword pommel -->
  <circle cx="256" cy="350" r="10" fill="url(#sword)"/>
  <!-- Fire particles -->
  <circle cx="180" cy="200" r="6" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="330" cy="180" r="5" fill="#ffd93d" opacity="0.7"/>
  <circle cx="160" cy="280" r="4" fill="#ff9800" opacity="0.6"/>
  <circle cx="340" cy="270" r="5" fill="#ff6b6b" opacity="0.7"/>
  <circle cx="200" cy="150" r="3" fill="#ffd93d" opacity="0.5"/>
  <circle cx="310" cy="140" r="4" fill="#ff6b6b" opacity="0.6"/>
  <!-- F letter accent -->
  <text x="256" y="460" text-anchor="middle" font-family="serif" font-size="48" font-weight="bold" fill="#8B5CF6" opacity="0.6">F</text>
</svg>
