<!DOCTYPE html>

  <style>

    #ui-overlay { position: absolute; top: 0; left: 0; right: 0; pointer-events: none; padding: 8px; }
    #ui-overlay > * { pointer-events: auto; }
    .hud-bar { background: rgba(0,0,0,0.7); border-radius: 4px; height: 16px; overflow: hidden; margin-bottom: 2px; position: relative; }
    .hud-bar .fill { height: 100%; transition: width 0.3s; }
    .hud-bar .label { position: absolute; left: 6px; top: 0; font-size: 9px; color: #fff; text-shadow: 1px 1px 2px #000; line-height: 16px; }
    .hud-info { display: flex; justify-content: space-between; font-size: 9px; margin-top: 1px; }
    .hud-info #gold-text { color: #ffd700; }
    .hud-info #level-text { color: #aaa; }


    /* Bottom bar */
    #bottom-bar {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.92); border-top: 1px solid #333;
      padding: 6px 6px 10px; display: none; z-index: 20;
    }
    .upgrade-row { display: flex; gap: 5px; justify-content: center; }
    .upg-btn {
      flex: 1; max-width: 76px; background: rgba(255,255,255,0.06);
      border: 1px solid #333; border-radius: 8px; padding: 5px 3px;
      text-align: center; cursor: pointer; transition: all 0.2s;
      font-size: 10px; color: #fff;
    }
    .upg-btn:not(:disabled):hover { border-color: #4caf50; background: rgba(76,175,80,0.1); }
    .upg-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .upg-btn .emoji { font-size: 16px; display: block; margin-bottom: 1px; }
    .upg-btn .cost { font-size: 8px; color: #ffd700; }
    .upg-btn .lvl { font-size: 7px; color: #888; }
    .prestige-row {
      display: flex; justify-content: center; margin-top: 4px;
    }

    #newgame-btn {
      background: rgba(255,50,50,0.1); border: 1px solid #ff4444;
      color: #ff4444; padding: 4px 10px; border-radius: 10px;
      font-size: 9px; cursor: pointer; margin-left: 6px;
    }

    /* Menu */
    #menu-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, #0a0a2a 0%, #1a0a3a 100%); z-index: 100; }
    #menu-screen h1 { font-size: 42px; background: linear-gradient(135deg, #ff6b6b, #ffd93d, #6bcb77); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 24px; }

    .hero-card:hover, .hero-card.selected { border-color: #6bcb77; background: rgba(107,203,119,0.1); transform: scale(1.05); }
    .hero-card .emoji { font-size: 28px; margin-bottom: 4px; }
    .hero-card .name { font-size: 12px; font-weight: bold; }
    .hero-card .class { font-size: 9px; color: #888; margin-top: 2px; }
    #start-btn { background: linear-gradient(135deg, #6bcb77, #4ecdc4); color: #000; border: none; padding: 12px 44px; font-size: 15px; font-weight: bold; border-radius: 24px; cursor: pointer; transition: transform 0.2s; }
    #start-btn:hover { transform: scale(1.05); }
    #start-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .farcaster-badge { position: absolute; bottom: 16px; display: flex; align-items: center; gap: 8px; color: #666; font-size: 11px; }
  </style>

</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <div id="ui-overlay">
      <div style="display:flex;gap:4px;align-items:center;">
        <div id="hp-bar" class="hud-bar" style="flex:1;">
          <div class="fill" style="width:100%;background:#e53935;"></div>
          <span class="label" id="hp-text">HP 100/100</span>
        </div>
        <div id="exp-bar" class="hud-bar" style="flex:1;">
          <div class="fill" style="width:0%;background:#4caf50;"></div>
          <span class="label" id="exp-text">EXP 0/100</span>
        </div>
      </div>
      <div class="hud-info">
        <span id="gold-text">0G</span>
        <span id="level-text">Lv.1</span>
      </div>
    </div>

    <!-- Upgrade Bar -->
    <div id="bottom-bar">
      <div class="upgrade-row">
        <div class="upg-btn" id="upg-atk" onclick="doUpgrade('atk')">
          <span class="emoji">⚔️</span>
          <span class="cost">20G</span>
          <span class="lvl">Lv.0</span>
        </div>
        <div class="upg-btn" id="upg-def" onclick="doUpgrade('def')">
          <span class="emoji">🛡️</span>
          <span class="cost">25G</span>
          <span class="lvl">Lv.0</span>
        </div>
        <div class="upg-btn" id="upg-hp" onclick="doUpgrade('hp')">
          <span class="emoji">❤️</span>
          <span class="cost">15G</span>
          <span class="lvl">Lv.0</span>
        </div>
        <div class="upg-btn" id="upg-spd" onclick="doUpgrade('spd')">
          <span class="emoji">⚡</span>
          <span class="cost">50G</span>
          <span class="lvl">Lv.0</span>
        </div>
      </div>
      <div class="prestige-row">
        <button id="newgame-btn" onclick="newGame()">New Game</button>
      </div>
    </div>

    <!-- Menu -->
    <div id="menu-screen">
      <h1>FARBORN</h1>
      <p class="subtitle">Born in the Far</p>
      <p class="tagline">Pure idle RPG. Zero taps.<br>Choose your hero, let the battle unfold.</p>
      <div class="hero-grid" id="hero-grid"></div>
      <button id="start-btn" disabled>Enter the Realm</button>
      <div class="farcaster-badge">
        <svg width="16" height="16" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="10" fill="#8B5CF6"/>
          <path d="M6 6L14 6L14 14L6 14Z" fill="white"/>
          <circle cx="10" cy="10" r="3" fill="#8B5CF6"/>
        </svg>
        <span>Farborn</span>
      </div>
    </div>
  </div>
</body>
</html>
