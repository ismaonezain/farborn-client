<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#2a1a4a"/>
      <stop offset="100%" stop-color="#0a0a1a"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="50%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#6bcb77"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#bg)"/>
  <!-- Decorative lines -->
  <line x1="100" y1="160" x2="300" y2="160" stroke="#8B5CF6" stroke-width="1" opacity="0.3"/>
  <line x1="500" y1="160" x2="700" y2="160" stroke="#8B5CF6" stroke-width="1" opacity="0.3"/>
  <!-- Title -->
  <text x="400" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="url(#title)" filter="url(#glow)">FARBORN</text>
  <!-- Subtitle -->
  <text x="400" y="230" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#888" letter-spacing="8">BORN IN THE FAR</text>
  <!-- Sword icon small -->
  <rect x="390" y="260" width="4" height="50" rx="1" fill="#e0e0ff" opacity="0.5"/>
  <rect x="380" y="306" width="24" height="4" rx="2" fill="#ffd700" opacity="0.5"/>
  <!-- Particles -->
  <circle cx="200" cy="120" r="3" fill="#ff6b6b" opacity="0.4"/>
  <circle cx="600" cy="130" r="2" fill="#ffd93d" opacity="0.3"/>
  <circle cx="150" cy="250" r="2" fill="#6bcb77" opacity="0.3"/>
  <circle cx="650" cy="240" r="3" fill="#ff6b6b" opacity="0.3"/>
  <circle cx="350" cy="320" r="2" fill="#ffd93d" opacity="0.2"/>
  <circle cx="450" cy="100" r="2" fill="#8B5CF6" opacity="0.3"/>
</svg>
